[pytest]
pythonpath = .
testpaths = tests
# Testele lente (benchmark pe 100 de scenarii, Ollama real) NU rulează implicit.
# Pentru ele: pytest -m slow   |   pentru Ollama real: pytest -m ollama
addopts = -m "not slow and not ollama" -q
markers =
    slow: test lent (> 5 s), rulat doar explicit
    ollama: necesită Ollama pornit local
