# Rolul 4: rulează DOAR când se schimbă frontendul sau contractele pe care le importă.
name: frontend

on:
  push:
    paths: ["frontend/**", "shared/contracts/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "shared/contracts/**", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
