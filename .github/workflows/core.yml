# Rolul 2: rulează DOAR când se schimbă algoritmii sau testele lor.
name: core (algoritmi)

on:
  push:
    paths: ["backend/app/core/**", "backend/tests/core/**", "backend/requirements.txt", ".github/workflows/core.yml"]
  pull_request:
    paths: ["backend/app/core/**", "backend/tests/core/**", "backend/requirements.txt", ".github/workflows/core.yml"]

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/core
